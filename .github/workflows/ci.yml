name: CI-CD api-cuenta
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Build, test and publish
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image tag
        id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore BootcampCLT2026.csproj
      - name: Build
        run: dotnet build BootcampCLT2026.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test BootcampCLT2026.csproj --configuration Release --no-build --verbosity normal
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Validate Helm chart
        run: |
          helm lint helm/cuenta-api
          helm template cuenta-api helm/cuenta-api > /dev/null
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cuenta:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/api-cuenta:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  cd:
    name: Deploy to local Minikube
    needs: ci
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Minikube context
        shell: powershell
        run: |
          minikube status
          kubectl config use-context minikube
          kubectl cluster-info
      - name: Deploy PostgreSQL and Seq
        shell: powershell
        run: |
          kubectl apply -f K8s/00-namespace.yaml
          kubectl apply -f K8s
          kubectl rollout status deployment/postgres --namespace cuentas --timeout=120s
          kubectl rollout status deployment/seq --namespace cuentas --timeout=120s
      - name: Apply database schema and seed
        shell: powershell
        run: |
          Get-Content database/02_create_table_and_seed.sql -Raw |
            kubectl exec --stdin deployment/postgres --namespace cuentas -- `
              psql -v ON_ERROR_STOP=1 -U postgres -d accountsdb
      - name: Deploy API with Helm
        shell: powershell
        run: |
          helm upgrade --install api-cuenta ./helm/cuenta-api `
            --namespace cuentas `
            --create-namespace `
            --set image.repository=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/api-cuenta `
            --set image.tag=${{ needs.ci.outputs.image_tag }} `
            --set image.pullPolicy=Always `
            --set probes.path=/v1/api/cuenta `
            --wait `
            --timeout 3m
      - name: Verify API rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/api-cuenta --namespace cuentas --timeout=120s
          kubectl get pods,services --namespace cuentas